# Coordinates for every project, so a release is a one-line bump.
group=dev.kotrace
version=0.6.0

kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true

# Required by :kotrace-room (androidx.room); inert for the JVM modules.
android.useAndroidX=true

# Publishing is manual. Point this at a local checkout of the static Maven repository behind
# https://maven.kotrace.dev, in ~/.gradle/gradle.properties or with -P:
#   kotrace.maven.repo.dir=/absolute/path/to/kotrace-maven-checkout
# then run ./gradlew publishAllPublicationsToKotraceMavenRepository and commit and push that repository.
