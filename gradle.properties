kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true

# Required by the Android module :kotrace-room (androidx.room on its classpath). Inert for the pure-JVM
# core and :kotrace-okhttp.
android.useAndroidX=true

# Publishing (manual, no CI Runner). Set the path to a local checkout of the dedicated static Maven
# repo (served at https://maven.kotrace.dev) in ~/.gradle/gradle.properties or via -P:
#   kotrace.maven.repo.dir=/absolute/path/to/kotrace-maven-checkout
# then: ./gradlew publishAllPublicationsToKotraceMavenRepository  &&  commit + push that repo.
