[versions]
kotlin = "2.4.10"
kotlinxCoroutines = "1.11.0"
junit = "4.13.2"
okhttp = "5.4.0"
mockk = "1.14.11"
# AGP 9.1.1 on Gradle 9.3.1 — matched to the Camailux app so the `-Pkotrace.local` composite (which pulls
# this repo into that build) does not hit "multiple AGP versions in one build". AGP 9 has built-in Kotlin:
# the Android module applies no kotlin plugin, and `compileSdk` uses the `version = release(N)` DSL.
agp = "9.1.1"
room = "2.8.4"
androidCompileSdk = "36"
androidMinSdk = "28"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
