[versions]
# The compiler. What the *published* artifacts require of a consumer is pinned separately, below.
kotlin = "2.4.10"
# Consumer baseline (ADR-027): the Kotlin language/API level the published modules compile against, and the
# stdlib version their POMs declare. A consumer on Kotlin 2.0+ can read this metadata; a newer stdlib wins by
# normal dependency resolution. Raise it only deliberately — it is a floor imposed on every consumer.
kotlinBaseline = "2.1"
kotlinStdlibBaseline = "2.1.0"
dokka = "2.2.0"
# Published `api` dependencies are declared at the lowest version kotrace supports (ADR-027), and the build
# compiles and tests against exactly that floor, so it cannot silently start using newer API. Consumers on a
# newer version keep theirs: Gradle resolves to the highest requested.
kotlinxCoroutines = "1.10.2"
junit = "4.13.2"
okhttp = "4.12.0"
# Test only: the newest OkHttp major, which `:kotrace-okhttp:testOkHttp5` runs the same compiled tests against.
okhttp5Test = "5.5.0"
mockk = "1.14.11"
# AGP 9.1.1 on Gradle 9.3.1 — matched to the Camailux app so the `-Pkotrace.local` composite (which pulls
# this repo into that build) does not hit "multiple AGP versions in one build". AGP 9 has built-in Kotlin:
# the Android module applies no kotlin plugin, and `compileSdk` uses the `version = release(N)` DSL.
agp = "9.1.1"
room = "2.8.4"
jmh = "1.37"
androidCompileSdk = "36"
androidMinSdk = "28"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
# Build only (build-logic): the ABI dumper KGP's `abiValidation()` runs, at the compiler's version, and AGP's
# variant API. `kotrace.android-abi` uses them to gate `:kotrace-room`, which `abiValidation()` cannot.
kotlin-abi-tools = { module = "org.jetbrains.kotlin:abi-tools", version.ref = "kotlin" }
kotlin-abi-tools-api = { module = "org.jetbrains.kotlin:abi-tools-api", version.ref = "kotlin" }
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
android-library = { id = "com.android.library", version.ref = "agp" }
